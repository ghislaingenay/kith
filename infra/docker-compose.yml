services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kith}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kithpassword}
      POSTGRES_DB: ${POSTGRES_DB:-kith}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kith}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Web UI for the postgres service — http://localhost:8080, System:
  # PostgreSQL, Server: postgres, Username/Password/DB: see the postgres
  # service's env above.
  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    # Docker Hub's minio/minio now denies anonymous pulls (MinIO restricted
    # public distribution there in 2025) — Quay still serves it freely.
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # The browser PUTs uploads to MinIO and GETs PDFs for the preview
      # straight from it, so the web origin must be allowed cross-origin.
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  # MinIO doesn't provision buckets on startup — this one-shot job creates
  # the bucket `app` uploads/reads from (S3_BUCKET below) and exits. It also
  # adds the `pending/` expiry rule ADR-0009 relies on as a backstop for
  # abandoned document uploads (the cron is the primary cleanup).
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    # bash, not sh: the mc image ships no grep/sed, so the idempotency check
    # below leans on bash's [[ ... ]] pattern matching instead.
    entrypoint: >
      bash -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-kith-dev} &&
      rules=$$(mc ilm rule ls local/${S3_BUCKET:-kith-dev} --json 2>/dev/null || true) &&
      if [[ $$rules == *pending/* ]]; then
        echo pending/ lifecycle rule already present;
      else
        mc ilm rule add local/${S3_BUCKET:-kith-dev} --prefix pending/ --expire-days 1;
      fi
      "

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI — view magic-link emails at http://localhost:8025
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ADR-0012: security is off for local development only.
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Web UI for OpenSearch — http://localhost:5601
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.1
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    depends_on:
      opensearch:
        condition: service_healthy

  app:
    build: ../backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /app/app
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kith}:${POSTGRES_PASSWORD:-kithpassword}@postgres:5432/${POSTGRES_DB:-kith}
      STORAGE_PROVIDER: minio
      S3_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      # Presigned avatar URLs are opened by the browser, which can't resolve
      # the in-network `minio` host — sign them for the published port.
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_BUCKET: ${S3_BUCKET:-kith-dev}
      # boto3's standard credential chain (core/storage/s3_provider.py) —
      # these are the vars it reads, matching the minio service's root user.
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      REDIS_URL: redis://redis:6379/0
      SEARCH_URL: http://opensearch:9200
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM_ADDRESS: noreply@kith.dev
      MAGIC_LINK_VERIFY_URL: http://localhost:3000/verify
      SESSION_COOKIE_SECURE: "false"
      # Search embeds the Query with it; empty when unset, so the API still
      # starts (with a warning) and every Search runs keyword only.
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    volumes:
      - ../backend:/app

  # ADR-0005: a second worker service off the same image, consuming the
  # `ingest` queue independently of `app`. `--watch app` mirrors `app`'s
  # `--reload` for the same dev hot-reload convenience.
  worker-ingest:
    build: ../backend
    command: arq workers.ingest.WorkerSettings --watch app
    environment:
      PYTHONPATH: /app/app
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kith}:${POSTGRES_PASSWORD:-kithpassword}@postgres:5432/${POSTGRES_DB:-kith}
      STORAGE_PROVIDER: minio
      S3_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-kith-dev}
      # boto3's standard credential chain (core/storage/s3_provider.py) —
      # these are the vars it reads, matching the minio service's root user.
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      REDIS_URL: redis://redis:6379/0
      SEARCH_URL: http://opensearch:9200
      # Empty when unset, so the other services still start; the worker
      # itself refuses an empty key at startup (ADR-0014).
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    volumes:
      - ../backend:/app

  frontend:
    image: node:22.22
    working_dir: /app
    # `pnpm run dev -- --host ...` forwards a literal "--" into `next dev`,
    # which this Next.js version's CLI then misparses as the positional
    # project-directory argument ("Invalid project directory ... --host").
    # `pnpm exec` calls the binary directly, sidestepping that passthrough.
    # Also: this Next.js version's flag is `--hostname` (`-H`), not `--host`.
    command: sh -lc "corepack enable && corepack prepare pnpm@8.6.12 --activate && pnpm install --frozen-lockfile && pnpm exec next dev --hostname 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://app:8000
      # Host-reachable on purpose — this runs in the browser, not inside
      # the compose network, so it can't resolve "app" as a hostname.
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ../frontend:/app
      - /app/node_modules
    healthcheck:
      # No dedicated /health route on the frontend — the dev server
      # answering "/" with 2xx is a fine readiness proxy for e2e/CI.
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      app:
        condition: service_healthy

volumes:
  opensearch-data:
  minio-data:
  postgres-data:
  redis-data:
