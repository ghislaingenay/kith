services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fast_os}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fast_os}
      POSTGRES_DB: ${POSTGRES_DB:-fast_os}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fast_os}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    # Docker Hub's minio/minio now denies anonymous pulls (MinIO restricted
    # public distribution there in 2025) — Quay still serves it freely.
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI — view magic-link emails at http://localhost:8025
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: ../backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /app/app
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fast_os}:${POSTGRES_PASSWORD:-fast_os}@postgres:5432/${POSTGRES_DB:-fast_os}
      STORAGE_PROVIDER: minio
      S3_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      # Magic-link email (ADR-0006) — Mailpit locally, no auth/TLS needed.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM_ADDRESS: noreply@kith.dev
      # Points at the frontend's verify route (not the API directly): it
      # does the server-side GET /auth/magic-link/verify + GET /me call,
      # forwarding cookies, then redirects (see frontend/app/verify/route.ts).
      MAGIC_LINK_VERIFY_URL: http://localhost:3000/verify
      # Local dev serves plain HTTP, so the session cookie's Secure flag
      # must be off here (ADR-0006) — prod overrides this to true (the
      # default) via real environment.
      SESSION_COOKIE_SECURE: "false"
      # Clerk credentials — set these in a root .env (docker compose loads
      # it automatically); never hardcode real secrets here.
      AUTH_PROVIDER: ${AUTH_PROVIDER:-clerk}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
      AUTH_JWT_KEY: ${AUTH_JWT_KEY:-}
      AUTH_AUTHORIZED_PARTIES: ${AUTH_AUTHORIZED_PARTIES:-http://localhost:3000}
      AUTH_WEBHOOK_SIGNING_SECRET: ${AUTH_WEBHOOK_SIGNING_SECRET}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    volumes:
      - ../backend:/app

  frontend:
    image: node:22.22
    working_dir: /app
    # `pnpm run dev -- --host ...` forwards a literal "--" into `next dev`,
    # which this Next.js version's CLI then misparses as the positional
    # project-directory argument ("Invalid project directory ... --host").
    # `pnpm exec` calls the binary directly, sidestepping that passthrough.
    # Also: this Next.js version's flag is `--hostname` (`-H`), not `--host`.
    command: sh -lc "corepack enable && corepack prepare pnpm@8.6.12 --activate && pnpm install --frozen-lockfile && pnpm exec next dev --hostname 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    environment:
      # Provided by the user via a root .env — never hardcoded here.
      VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
      # Host-reachable on purpose — this runs in the browser, not inside
      # the compose network, so it can't resolve "app" as a hostname.
      VITE_API_BASE_URL: http://localhost:8000
      # Next.js only exposes NEXT_PUBLIC_*-prefixed vars to the browser
      # (the VITE_ vars above predate ADR-0006's move off Vite).
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    volumes:
      - ../frontend:/app
      - /app/node_modules
    healthcheck:
      # No dedicated /health route on the frontend — the dev server
      # answering "/" with 2xx is a fine readiness proxy for e2e/CI.
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      app:
        condition: service_healthy

volumes:
  minio-data:
  postgres-data:
  redis-data:
