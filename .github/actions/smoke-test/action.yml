name: Smoke-test the production stack
description: >
  Starts infra/docker-compose.prod.yml from images already built on this
  runner, with infra/deploy.sh, and checks Caddy's routing over HTTPS. Then
  deploys again while polling through Caddy: no request may fail while
  `docker rollout` replaces the containers. It tests frontend/Dockerfile, the
  prod compose file, the Caddyfile, the release command and the deploy script.
  Used by smoke.yml on pull requests and by deploy.yml before the push.

inputs:
  image-tag:
    description: Tag of the locally built ghcr.io/ghislaingenay/kith-backend and kith-frontend images
    required: true

runs:
  using: composite
  steps:
    # Every `docker compose` below uses the prod file, and reads infra/.env.
    # Throwaway values. Empty AI keys: the API starts with warnings. Storage
    # points at S3 with dummy credentials; nothing here uploads.
    - name: Write a throwaway .env
      shell: bash
      working-directory: infra
      run: |
        echo "COMPOSE_FILE=docker-compose.prod.yml" >> "$GITHUB_ENV"
        cat > .env <<'EOF'
        DOMAIN=localhost
        APP_URL=https://localhost
        POSTGRES_USER=kith
        POSTGRES_PASSWORD=smoke-password
        POSTGRES_DB=kith
        STORAGE_PROVIDER=s3
        S3_BUCKET=kith-smoke
        S3_REGION=us-east-1
        AWS_ACCESS_KEY_ID=dummy
        AWS_SECRET_ACCESS_KEY=dummy
        BACKUP_AWS_ACCESS_KEY_ID=dummy
        BACKUP_AWS_SECRET_ACCESS_KEY=dummy
        CORS_ALLOWED_ORIGINS=https://localhost
        MAGIC_LINK_VERIFY_URL=https://localhost/verify
        SESSION_COOKIE_SECURE=true
        SMTP_HOST=localhost
        MAIL_FROM_ADDRESS=noreply@example.com
        OPENAI_API_KEY=
        VOYAGE_API_KEY=
        LOG_FORMAT=json
        EOF

    # The same version the quickstart installs on the VPS.
    - name: Install docker rollout
      shell: bash
      run: |
        mkdir -p ~/.docker/cli-plugins
        curl -fsSL https://raw.githubusercontent.com/wowu/docker-rollout/v0.14/docker-rollout -o ~/.docker/cli-plugins/docker-rollout
        chmod +x ~/.docker/cli-plugins/docker-rollout

    # A first deploy on an empty stack, as on a fresh server. worker-ingest is
    # started but not waited on: it refuses an empty VOYAGE_API_KEY at
    # startup (ADR-0014).
    - name: Deploy on an empty stack
      shell: bash
      working-directory: infra
      env:
        IMAGE_TAG: ${{ inputs.image-tag }}
      run: |
        sh deploy.sh "$IMAGE_TAG"
        docker compose up -d --no-recreate --wait --wait-timeout 180 app frontend caddy

    - name: Check Caddy's routing over HTTPS
      shell: bash
      working-directory: infra
      run: |
        set -eu
        # Trust Caddy's local CA rather than skipping TLS verification.
        docker compose exec -T caddy timeout 60 sh -c \
          'until [ -f /data/caddy/pki/authorities/local/root.crt ]; do sleep 1; done; cat /data/caddy/pki/authorities/local/root.crt' > caddy-root.crt
        https_get() { curl -sS --cacert caddy-root.crt --retry 10 --retry-connrefused --retry-delay 2 "$@"; }

        echo "/health answers from FastAPI"
        health=$(https_get https://localhost/health)
        [ "$health" = '{"status":"ok"}' ]

        echo "/api/v1/me answers from FastAPI (401 without a Session)"
        body_and_status=$(https_get -w '\n%{http_code}' https://localhost/api/v1/me)
        [ "$(echo "$body_and_status" | tail -n1)" = 401 ]
        echo "$body_and_status" | grep -q '"error":"unauthorized"'

        echo "/ answers from Next.js (redirects to /sign-in)"
        page=$(https_get -L https://localhost/)
        echo "$page" | grep -q '/_next/static/'

        echo "www. redirects to the bare domain, keeping the path"
        redirect=$(https_get --resolve www.localhost:443:127.0.0.1 -o /dev/null -w '%{http_code} %{redirect_url}' https://www.localhost/sign-in?next=x)
        echo "  got: $redirect"
        [ "$redirect" = "301 https://localhost/sign-in?next=x" ]

    # Deploys again while polling /health (the API) and / (the frontend)
    # through Caddy, with no retries: every request must succeed while both
    # containers are replaced.
    - name: Check the rollout drops no request
      shell: bash
      working-directory: infra
      env:
        IMAGE_TAG: ${{ inputs.image-tag }}
      run: |
        set -eu
        rm -f rollout-done
        : > polls
        (
          while [ ! -f rollout-done ]; do
            for url in https://localhost/health https://localhost/; do
              if curl -fsS -o /dev/null --max-time 10 --cacert caddy-root.crt "$url"; then
                echo "ok $url" >> polls
              else
                echo "failed $url" >> polls
              fi
            done
          done
        ) &
        # Stops the poller even when the deploy fails.
        trap 'touch rollout-done' EXIT

        sh deploy.sh "$IMAGE_TAG"
        touch rollout-done
        wait

        answered=$(grep -c '^ok' polls || true)
        echo "$answered requests answered, $(grep -c '^failed' polls || true) failed"
        # Not `! grep`: `set -e` ignores a negated command.
        if grep '^failed' polls; then exit 1; fi
        [ "$answered" -gt 0 ]
        # The new containers replaced the old ones: one of each is left.
        [ "$(docker compose ps -q app | wc -l)" = 1 ]
        [ "$(docker compose ps -q frontend | wc -l)" = 1 ]

    - name: Show logs on failure
      if: failure()
      shell: bash
      working-directory: infra
      run: docker compose logs --no-color

    - name: Tear down
      if: always()
      shell: bash
      working-directory: infra
      run: docker compose down -v
