name: Backend CI

on:
  push:
    paths:
      - "backend/**"
  pull_request:
    paths:
      - "backend/**"
  # deploy.yml runs these tests before building the images.
  workflow_call:

# github.workflow is the caller's name when deploy.yml calls this, so the
# deploy's run never cancels (or is cancelled by) this workflow's own run.
concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        working-directory: backend
        run: uv sync --all-groups

      - name: Run tests
        working-directory: backend
        run: uv run pytest -q --cov=app --cov-report=term-missing --cov-fail-under=80
