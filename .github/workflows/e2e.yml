name: E2E

on:
  push:
    paths:
      - "frontend/**"
      - "backend/**"
      - "infra/docker-compose.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "infra/docker-compose.yml"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.6.12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend

      - name: Start the compose stack
        working-directory: infra
        env:
          # Unused by the app itself (Clerk predates ADR-0006's own-auth
          # switch) but docker-compose.yml still declares them without a
          # default, so compose needs something here.
          AUTH_SECRET_KEY: e2e-placeholder
          AUTH_WEBHOOK_SIGNING_SECRET: e2e-placeholder
        run: docker compose up -d --wait

      - name: Run Playwright tests
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:3000
          MAILPIT_URL: http://localhost:8025
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Dump compose logs on failure
        if: failure()
        working-directory: infra
        run: docker compose logs

      - name: Tear down the compose stack
        if: always()
        working-directory: infra
        run: docker compose down -v
