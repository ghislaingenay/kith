name: Deploy

# A push to master tests, builds both images (tagged with the commit SHA and
# `latest`), smoke-tests them, pushes them to GHCR and deploys them to the VPS
# over SSH (docs/deploy-quickstart.md, step 8). A manual run with an older
# image tag is the rollback: it skips testing and building, and deploys that
# tag with the infra files of the same commit.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Full commit SHA whose images are in GHCR
        required: true
        type: string

# One deploy at a time. A running deploy is never cancelled; a newer run
# waiting behind it replaces an older waiting one, so the latest commit wins.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  BACKEND_IMAGE: ghcr.io/ghislaingenay/kith-backend
  FRONTEND_IMAGE: ghcr.io/ghislaingenay/kith-frontend

jobs:
  backend:
    if: github.event_name == 'push'
    uses: ./.github/workflows/backend.yml

  frontend:
    if: github.event_name == 'push'
    uses: ./.github/workflows/frontend.yml

  # Build, smoke test and push run on one runner, so the images pushed are the
  # ones the smoke test ran.
  images:
    name: Build, smoke-test and push the images
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build the backend image
        run: >
          docker build
          -t "$BACKEND_IMAGE:${{ github.sha }}" -t "$BACKEND_IMAGE:latest"
          --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
          --build-arg GIT_SHA=${{ github.sha }}
          backend

      # Unset variables are left out, so the Dockerfile's defaults apply.
      - name: Build the frontend image
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_ASK_SHOW_SOURCES: ${{ vars.NEXT_PUBLIC_ASK_SHOW_SOURCES }}
          NEXT_PUBLIC_ASK_CITATION_MARKERS: ${{ vars.NEXT_PUBLIC_ASK_CITATION_MARKERS }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE }}
        run: |
          build_args=()
          for name in ${!NEXT_PUBLIC_@}; do
            if [ -n "${!name}" ]; then build_args+=(--build-arg "$name=${!name}"); fi
          done
          docker build \
            -t "$FRONTEND_IMAGE:${{ github.sha }}" -t "$FRONTEND_IMAGE:latest" \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --build-arg GIT_SHA=${{ github.sha }} \
            "${build_args[@]}" \
            frontend

      - uses: ./.github/actions/smoke-test
        with:
          image-tag: ${{ github.sha }}

      - name: Push to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push --all-tags "$BACKEND_IMAGE"
          docker push --all-tags "$FRONTEND_IMAGE"

  deploy:
    name: Deploy to the VPS
    needs: images
    # On a rollback `images` is skipped, and the deploy still runs.
    if: ${{ !cancelled() && (needs.images.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
    steps:
      - name: Check the image tag
        run: |
          if ! echo "$IMAGE_TAG" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "image_tag must be a full commit SHA, got '$IMAGE_TAG'" >&2
            exit 1
          fi

      # The infra files of the commit being deployed, so a rollback also
      # rolls back the compose file and Caddyfile.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      # The host key is pinned (VPS_KNOWN_HOSTS), so CI never trusts whatever
      # answers at VPS_HOST.
      - name: Set up SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      # Overwritten in place, so Caddy's bind mount of the Caddyfile follows.
      - name: Copy the infra files
        run: scp infra/docker-compose.prod.yml infra/Caddyfile infra/pg-backup.sh infra/deploy.sh vps:/opt/kith/

      # deploy.sh stops before the rollout if the release step fails, leaving
      # the old version serving. Images built over a week ago that no
      # container uses are pruned so the disk never fills (a rollback pulls
      # one again); a failed prune does not fail the deploy.
      - name: Deploy
        run: ssh vps "cd /opt/kith && sh deploy.sh $IMAGE_TAG && { docker image prune -af --filter until=168h || true; }"
